name: validate

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  skills:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Kiểm tra frontmatter và cấu trúc skill
        run: python scripts/validate_skills.py

      - name: Kiểm tra cú pháp shell script
        run: bash -n scripts/install.sh
